<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>n&e wallet</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">n&e wallet.</div>
    <div class="people">
      <button class="person-pill active"><span>N</span>Nisu</button>
      <button class="person-pill"><span>E</span>Erol</button>
      <button class="icon-btn" onclick="toggleDark()">☾</button>
    </div>
  </header>

  <section class="summary">
    <div>
      <div class="eyebrow">Nisu’nun net durumu</div>
      <div class="hero-number" id="nisuNet"></div>
      <div class="subline">para + yatırımlar − kalan borçlar</div>
    </div>
    <div class="couple-total">
      <span>ikimizin toplamı:</span>
      <b id="combined"></b>
    </div>
  </section>

  <nav class="tabs">
    <button class="active">birlikte harcama</button>
    <button>param</button>
    <button>borcum</button>
    <button>yatırım</button>
  </nav>

  <main>
    <div class="section-tabs">
      <button class="active">durum</button>
      <button>harcamalar</button>
      <button>borçlar</button>
      <button>yatırımlar</button>
    </div>

    <section class="wallet-grid">
      <article class="wallet-card">
        <div class="card-head">
          <div class="identity"><div class="avatar">N</div><div><small>Nisu</small><h2>Nisu</h2></div></div>
          <button class="soft-btn">para yeri ekle</button>
        </div>
        <div class="net" id="nisuNetCard"></div><div class="label">net durum</div>
        <div class="mini-grid">
          <div><span>para</span><b id="nisuCash"></b></div>
          <div><span>yatırım</span><b id="nisuInv"></b></div>
          <div><span>borç</span><b id="nisuDebt"></b></div>
          <div><span>bu ay</span><b>₺0</b></div>
        </div>
        <div class="accounts" id="accounts"></div>
      </article>

      <article class="wallet-card">
        <div class="card-head">
          <div class="identity"><div class="avatar">E</div><div><small>Erol</small><h2>Erol</h2></div></div>
          <button class="soft-btn">para yeri ekle</button>
        </div>
        <div class="net" id="erolNet"></div><div class="label">net durum</div>
        <div class="mini-grid">
          <div><span>para</span><b id="erolCash"></b></div>
          <div><span>yatırım</span><b id="erolInv"></b></div>
          <div><span>borç</span><b id="erolDebt"></b></div>
          <div><span>bu ay</span><b>₺0</b></div>
        </div>
      </article>
    </section>

    <section class="moves">
      <div class="moves-title"><div><small>SON HAREKETLER</small><h2>bu aralar ne aldık?</h2></div><button class="add" onclick="openModal()">+ ekle</button></div>
      <div id="transactions"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="modal-card">
  <div class="modal-head"><h3>harcama ekle</h3><button onclick="closeModal()">✕</button></div>
  <form class="form" onsubmit="addTx(event)">
   <select name="owner"><option value="nisu">Nisu</option><option value="erol">Erol</option></select>
   <input name="merchant" placeholder="işletme / açıklama" required>
   <input name="amount" type="number" step="0.01" placeholder="tutar" required>
   <select name="category"><option>yemek/kafe</option><option>market</option><option>giyim</option><option>kozmetik</option><option>ulaşım</option><option>fatura</option><option>eğlence</option><option>sağlık</option><option>eğitim</option><option>ev</option><option>teknoloji</option><option>diğer</option></select>
   <input name="account" placeholder="hesap / kart" value="Yapı Kredi">
   <input name="date" type="date" required>
   <button class="primary">kaydet</button>
  </form>
 </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
