<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>n&e wallet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="n&e wallet">
      <span class="brand-mark">n&e</span><span class="brand-word">wallet.</span>
    </a>
    <div class="user-switch">
      <button class="user active"><span class="user-dot nisu">N</span><b>Nisu</b></button>
      <button class="user"><span class="user-dot erol">E</span><span>Erol</span></button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <div class="hero-title">Nisu’nun net durumu</div>
      <div id="nisuNet" class="hero-value">₺0</div>
      <div class="hero-caption">para + yatırımlar − kalan borçlar</div>
      <div class="hero-total">ikimizin toplamı: <b id="combined">₺0</b></div>
    </div>
    <div class="together-badge"><span>✣</span><em>birlikte</em></div>
    <div class="hero-ring" aria-hidden="true"></div>
  </section>

  <nav class="primary-actions" aria-label="ana işlemler">
    <button class="action-card active"><span class="action-icon">＋</span><b>harcama</b></button>
    <button class="action-card"><span class="action-icon">▱</span><b>param</b></button>
    <button class="action-card"><span class="action-icon">▤</span><b>borcum</b></button>
    <button class="action-card"><span class="action-icon">↗</span><b>yatırım</b></button>
  </nav>

  <nav class="subtabs">
    <button class="active">durum</button><button>harcamalar</button><button>borçlar</button><button>yatırımlar</button>
  </nav>

  <main>
    <section class="person-grid">
      <article class="person-card nisu-card">
        <div class="person-head">
          <div class="person-name"><span class="user-dot nisu">N</span><span>Nisu</span></div>
          <button class="edit-btn" onclick="editDebt('nisu')" aria-label="Nisu borcunu düzenle">⌕</button>
        </div>
        <div id="nisuNetCard" class="person-net">₺0</div>
        <div class="net-label">net durum</div>
        <div class="stat-grid">
          <div><span>para</span><b id="nisuCash">₺0</b></div>
          <div><span>yatırım</span><b id="nisuInv">₺0</b></div>
          <div><span>borç</span><b id="nisuDebt">₺0</b></div>
          <div><span>bu ay</span><b>₺0</b></div>
        </div>
        <div id="accounts" class="account-list"></div>
      </article>

      <article class="person-card erol-card">
        <div class="person-head">
          <div class="person-name"><span class="user-dot erol">E</span><span>Erol</span></div>
          <button class="edit-btn" onclick="editDebt('erol')" aria-label="Erol borcunu düzenle">⌕</button>
        </div>
        <div id="erolNet" class="person-net">₺0</div>
        <div class="net-label">net durum</div>
        <div class="stat-grid">
          <div><span>para</span><b id="erolCash">₺0</b></div>
          <div><span>yatırım</span><b id="erolInv">₺0</b></div>
          <div><span>borç</span><b id="erolDebt">₺0</b></div>
          <div><span>bu ay</span><b>₺0</b></div>
        </div>
      </article>
    </section>

    <section class="moves-card">
      <div class="moves-head"><div><small>SON HAREKETLER</small><h2>bu aralar ne aldık?</h2></div><button class="add-btn" onclick="openModal()">+ ekle</button></div>
      <div id="transactions"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-head"><h3>harcama ekle</h3><button onclick="closeModal()">✕</button></div>
    <form class="form" onsubmit="addTx(event)">
      <select name="owner"><option value="nisu">Nisu</option><option value="erol">Erol</option></select>
      <input name="merchant" placeholder="işletme / açıklama" required />
      <input name="amount" type="number" step="0.01" placeholder="tutar" required />
      <select name="category"><option>yemek/kafe</option><option>market</option><option>giyim</option><option>kozmetik</option><option>ulaşım</option><option>fatura</option><option>eğlence</option><option>sağlık</option><option>eğitim</option><option>ev</option><option>teknoloji</option><option>diğer</option></select>
      <input name="account" placeholder="hesap / kart" value="Yapı Kredi" />
      <input name="date" type="date" required />
      <button class="save-btn">kaydet</button>
    </form>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
